name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} integration
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, simplexml
          coverage: none
      - name: Validate XML
        run: php -r '$xml = simplexml_load_file("src/etc/xml/billmgr_mod_pmanore.php.xml"); if ($xml === false) { exit(1); }'
      - name: Run isolated integration tests
        run: node tests/http.mjs

  release-archive:
    name: Reproducible release archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build archive twice and verify reproducibility
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          scripts/build-release.sh dist/first
          scripts/build-release.sh dist/second
          cmp dist/first/billmanager6-module.tar.gz dist/second/billmanager6-module.tar.gz
          cmp dist/first/billmanager6-module.tar.gz.sha256 dist/second/billmanager6-module.tar.gz.sha256
          (cd dist/first && sha256sum --check billmanager6-module.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: billmanager6-module-${{ github.sha }}
          path: |
            dist/first/billmanager6-module.tar.gz
            dist/first/billmanager6-module.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
